[package]
name = "md-reader"
version = "0.2.12"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# 文件 / 文件夹选择对话框。
# 前端不能用 <input type="file">：WebView2 出于安全考虑，
# 即便开了 Tauri 资产协议，HTML 拿到的 File 对象也只有文件名没有完整路径。
# baseDir 一旦空，相对路径的图片（如 ![样例](sample-image.svg)）全部解析失败，
# 这是 v0.2 安装包里「样例图片没打开」的根因。
# tauri-plugin-dialog 的 open() 能绕过浏览器安全限制，把完整路径交回给前端。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Firefox 用的同一套字符集解码器，纯 Rust。只为读 GBK 编码的旧 md 文件引入。
# 前端 TextDecoder 理论上也能解 gbk，但那要把整个文件的字节搬到前端，
# 10 MB 的文件经 invoke 序列化会膨胀到几十 MB，完全不可接受，所以解码必须在 Rust 侧做完。
encoding_rs = "0.8"

